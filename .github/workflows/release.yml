name: Release build

# One workflow, two parallel jobs (windows + macos) publishing the same tag.
# Releases publish Windows + macOS only (policy 2026-10-20). The macOS job
# builds the universal (Apple Silicon + Intel) app bundle, ZIP and DMG with
# scripts/build/build-macos.py; signing stays ad-hoc (no Developer ID secret
# here), matching the "临时签名、未公证" note in the README download table.
# Supported releases are macOS 15, 26 and 27 (bundle floor 15.0), so the job runs
# on a macos-15 runner: its SDK is at least the deployment target, which
# build-macos.py now verifies before compiling.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to (re)publish
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Ensure NSIS
        shell: pwsh
        run: |
          $dir = "${env:ProgramFiles(x86)}\NSIS"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "$dir\makensis.exe")) { choco install nsis -y --no-progress }
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:Path += ";$dir"
          }
          (Get-Command makensis).Source
      - name: Build desktop binary
        run: go build -buildvcs=false -trimpath -tags desktop,production -ldflags "-s -w -H windowsgui" -o build/out/DevShell.exe .
      - name: Prepare Windows image
        run: go run ./cmd/prepare-windows-image -in build/out/DevShell.exe -out build/out/DevShell-prepared.exe
      - name: Stage distribution
        run: python scripts/build/stage-windows.py --binary build/out/DevShell-prepared.exe --stage build/out/stage
      - name: Build installer
        run: python scripts/build/package-windows.py --stage build/out/stage --output build/out/DevShell-Setup-x64.exe
      - name: Build update artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = (Select-String -Path internal/app/updates.go -Pattern 'const ApplicationVersion = "([^"]+)"').Matches[0].Groups[1].Value
          $notes = "docs/release/RELEASE-$tag.md"
          if (-not (Test-Path $notes)) { $notes = "docs/release/RELEASE-$version.md" }
          python scripts/build/make-windows-update.py --binary build/out/DevShell-prepared.exe --output-dir build/out/update --notes-file $notes
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = (Select-String -Path internal/app/updates.go -Pattern 'const ApplicationVersion = "([^"]+)"').Matches[0].Groups[1].Value
          $notes = "docs/release/RELEASE-$tag.md"
          if (-not (Test-Path $notes)) { $notes = "docs/release/RELEASE-$version.md" }
          $releaseOptions = @('--latest')
          if ($tag -match '-(rc|alpha|beta)([0-9.-]|$)') {
            $releaseOptions = @('--prerelease', '--latest=false')
          }
          if (gh release view $tag 2>$null) {
            gh release edit $tag --title "DevShell $tag" --notes-file $notes @releaseOptions
          } else {
            gh release create $tag --title "DevShell $tag" --notes-file $notes @releaseOptions
          }
          gh release upload $tag build/out/DevShell-Setup-x64.exe build/out/update/up.exe build/out/update/up.exe.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build universal app, ZIP and DMG
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          notes="docs/release/RELEASE-$tag.md"
          version=$(sed -n 's/^const ApplicationVersion = "\([^\"]*\)".*/\1/p' internal/app/updates.go)
          if [[ ! -f "$notes" ]]; then notes="docs/release/RELEASE-$version.md"; fi
          python3 scripts/build/build-macos.py --arch universal --output build/macos-release --notes-file "$notes"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(sed -n 's/^const ApplicationVersion = "\([^"]*\)".*/\1/p' internal/app/updates.go)
          notes="docs/release/RELEASE-$tag.md"
          if [[ ! -f "$notes" ]]; then notes="docs/release/RELEASE-$version.md"; fi
          release_options=(--latest)
          if [[ "$tag" =~ -(rc|alpha|beta)([0-9.-]|$) ]]; then
            release_options=(--prerelease --latest=false)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "DevShell $tag" --notes-file "$notes" "${release_options[@]}"
          else
            gh release create "$tag" --title "DevShell $tag" --notes-file "$notes" "${release_options[@]}"
          fi
          gh release upload "$tag" \
            build/macos-release/DevShell-macos-universal.dmg \
            build/macos-release/DevShell-macos-universal.zip \
            build/macos-release/up-macos-arm64.json \
            build/macos-release/up-macos-amd64.json \
            build/macos-release/SHA256SUMS.txt \
            build/macos-release/build-info.json \
            --clobber
  finalize-26-10-1:
    name: Finalize v26.10.1 and retire interim builds
    needs: [windows, macos]
    # One-time cleanup explicitly authorized for this stable release only.
    if: ${{ (github.event.inputs.tag || github.ref_name) == 'v26.10.1-build26102401' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Verify stable assets and remove RC releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/build/finalize-v26.10.1.py
