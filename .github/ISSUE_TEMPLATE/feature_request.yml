name: 💡 功能建议
description: 为 DevShell 提出新功能或改进建议
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎建议！请先浏览 [README 功能概览](https://github.com/yuhongwei380/DevShell#%E5%8A%9F%E8%83%BD%E6%A6%82%E8%A7%88) 和 [已有建议](https://github.com/yuhongwei380/DevShell/issues?q=is%3Aissue+label%3Aenhancement)，避免重复提交。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / 想解决的问题
      description: 你日常在什么情况下需要它？现在是怎么绕过去的？
      placeholder: 例如：管理多台 VPS 时，需要逐台手动查看磁盘占用……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能
      description: 描述你希望 DevShell 提供什么，越具体越好（入口在哪、怎么操作、结果是什么）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案
      description: 如果完整方案较重，有没有简化版也能满足需求？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 其他工具的做法、参考截图等（可直接拖拽图片）
    validations:
      required: false
