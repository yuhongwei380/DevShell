<!doctype html><meta charset="utf-8"><title>DevShell 原版 / GPUI 对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#243b4e;font:14px/1.6 system-ui}header{padding:18px 24px;background:white;position:sticky;top:0;z-index:2;border-bottom:1px solid #dce6ee}h1{font-size:20px;margin:0 0 8px}p{margin:6px 0}select,button{font:inherit;padding:7px 12px;border:1px solid #cedde8;border-radius:8px;background:white;color:inherit}label{display:inline-flex;gap:8px;align-items:center;margin-right:18px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}figure{margin:0;min-width:0}figcaption{padding:8px;font-weight:600}img{display:block;width:100%;height:auto}.overlay{position:relative;margin:16px;max-width:1280px}.overlay img{width:100%}.overlay .upper{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.overlay:after{content:"";position:absolute;top:0;bottom:0;left:var(--split,50%);border-left:2px solid #f4b16d}input{vertical-align:middle}[hidden]{display:none!important}.note{color:#486174;font-size:12px}
</style><header><h1>DevShell 原版 / GPUI 实际绘制对照</h1><p class="note">基准 v26.11.3-rc.3 · eb3e1733 · 同一份隔离配置 · 1280 × 800。用于逐页核对；尚未通过 100% 视觉与功能等价验收。</p><label>页面 <select id="stage"><option value="main">欢迎页</option><option value="servers">服务器管理</option><option value="connection">新建连接</option><option value="settings">设置菜单</option><option value="ui-style">全局主题</option><option value="charts">曲线样式</option><option value="shell-fonts">Shell 字体</option><option value="ui-fonts">界面字体</option><option value="files-bottom">文件面板 · 底部</option><option value="files-top">文件面板 · 顶部</option><option value="files-right">文件面板 · 右侧</option><option value="files-selection">文件多选</option><option value="files-menu">文件多选菜单</option><option value="files-single-menu">文件右键菜单</option><option value="files-create-menu">新建菜单</option><option value="files-open-with">打开方式子菜单</option><option value="files-new">新建文件</option><option value="files-delete">删除确认</option><option value="files-permissions">文件权限</option><option value="files-upload">上传同名确认</option><option value="monitor">系统监控</option><option value="ansi">配色方案 · 空列表</option><option value="ansi-populated">配色方案 · 已导入</option></select></label><label>主题 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><button id="mode">切换为叠加对照</button><label id="slider" hidden>分界 <input type="range" id="split" min="0" max="100" value="50"></label><p id="note" class="note"></p></header><main><section class="pair" id="pair"><figure><figcaption>原版 web/</figcaption><img id="ref" alt="原版"></figure><figure><figcaption>GPUI</figcaption><img id="native" alt="GPUI"></figure></section><section class="overlay" id="overlay" hidden><img id="refOverlay" alt="原版"><div class="upper" id="upper"><img id="nativeOverlay" alt="GPUI"></div></section></main><script>
const $=id=>document.getElementById(id);let overlay=false;const notes={main:'仍需核对文字字重、背景渐变和细节颜色。',servers:'仍需核对树层级、中文排序与完整交互。',connection:'仍缺原版背景模糊；串口、RDP 和展开状态需继续验收。',settings:'菜单可见布局对照；所有子页面并未全部通过验收。','ui-style':'主题选项和卡片已接入；液态玻璃材质尚未等价。',charts:'实际绘制预览；曲线样式已应用到真实监控曲线；颜色选择器等交互仍需继续核对。','shell-fonts':'字体面板布局已恢复；字体颜色弹窗、在线字体库仍有差距。','ui-fonts':'界面字体卡片及文字颜色的完整编辑布局仍需核对。','ansi':'导入、应用、重命名及两步删除已接入；背景模糊尚未实现。','ansi-populated':'使用固定测试色板展示已导入列表，不读取真实配置。','monitor':'原版滚动历史、缩放轴、断点及 ICMP 超时曲线已移植；MTR 和完整进程详情仍待还原。','files-new':'新建窗口布局已对照；背景模糊尚未实现。','files-delete':'使用原版一次确认和捕获目标；背景模糊尚未实现。','files-permissions':'八进制权限和 3×3 位开关已接入；仍需真实 SFTP 与键盘交互验收。','files-upload':'同名预检、跳过和逐项目覆盖授权已接入；背景模糊尚未实现。'};
function update(){const name=$('stage').value+'-'+$('theme').value;for(const id of ['ref','refOverlay'])$(id).src='reference/screenshots/'+name+'.png';for(const id of ['native','nativeOverlay'])$(id).src='native-scenes/'+name+'.png';$('note').textContent=notes[$('stage').value]||'';}for(const id of ['stage','theme'])$(id).onchange=update;$('mode').onclick=()=>{overlay=!overlay;$('pair').hidden=overlay;$('overlay').hidden=!overlay;$('slider').hidden=!overlay;$('mode').textContent=overlay?'切换为并排对照':'切换为叠加对照';};$('split').oninput=()=>{$('upper').style.clipPath='inset(0 '+(100-$('split').value)+'% 0 0)';$('overlay').style.setProperty('--split',$('split').value+'%');};update();</script>
